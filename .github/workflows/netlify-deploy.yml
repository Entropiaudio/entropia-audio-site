# Production deploys for every push to main, whoever pushed it.
#
# Why this exists: the repo is private and the Netlify team is on the free
# plan, so Netlify only builds pushes from the one GitHub account linked to it
# (Entropiaudio). A push or PR merge made through any other account, including
# topazh1 and every Claude Code session, sits at "Pending approval" and never
# goes live, and the free plan can't link a second account.
#
# Netlify exempts build-hook deploys from that check, so this workflow calls
# the site's production build hook. Netlify then builds main exactly as it does
# for a normal push: same build command, same production context, and the same
# environment variables (VITE_MOONBASE_URL included).
#
# One-time setup (already done if this runs green):
#   1. Netlify → the project → Project configuration → Build & deploy →
#      Continuous deployment → Build hooks → Add build hook, branch: main.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions →
#      New repository secret, name NETLIFY_BUILD_HOOK, value: the hook URL.
name: Netlify production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  build-hook:
    # Entropiaudio's own pushes already build through Netlify's Git
    # integration, so skip them to avoid building the same commit twice.
    # A manual run always fires.
    if: github.actor != 'Entropiaudio' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Netlify production build
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::The NETLIFY_BUILD_HOOK secret is missing. See the one-time setup at the top of .github/workflows/netlify-deploy.yml."
            exit 1
          fi
          # the deploy's title in Netlify: short sha + commit subject
          title=$(printf '%s %s' "${GITHUB_SHA::7}" "$(printf '%s' "${SUBJECT:-manual run}" | head -n1)" | jq -sRr @uri)
          curl --fail-with-body -sS -X POST -d '{}' "${HOOK}?trigger_title=${title}"
          echo "Netlify build triggered for ${GITHUB_SHA::7}."
